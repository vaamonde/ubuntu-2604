# Data de criação: 12/09/2026
# Data de atualização: 12/09/2026
# Versão: 0.02
# Testado e homologado para a versão do Ubuntu Server 26.04.x LTS x64
# Testado e homologado para a versão do Prometheus 3.13.x e Node Exporter 1.12.x
#
# OBSERVAÇÃO IMPORTANTE: o label "job" identifica o TIPO de scrape configurado no arquivo
# prometheus.yml (exemplo: job_name: node_exporter), sendo compartilhado por TODOS os
# servidores que utilizam esse mesmo job. Quem identifica o servidor especifico e o label
# "instance" (exemplo: srvvaamonde:9100), por isso as expressoes abaixo NAO fixam o nome
# do host no filtro, garantindo que as mesmas regras sirvam para toda a frota de servidores
# on-premises e, futuramente, tambem para instancias na nuvem (Cloud).
#
# OBSERVAÇÃO IMPORTANTE: ajuste o valor do label "job" abaixo (variavel JOB_NODE_EXPORTER)
# conforme o nome definido no bloco "scrape_configs" do seu arquivo prometheus.yml.
#
# ======= BLOCO DE ALERTAS BÁSICO DO NODE EXPORTER LINUX =======
#
# Configuração dos grupos de alertas do Node Exporter
groups:
- name: alertas-node-linux
  rules:
  #
  # Configuração do alerta de: Node Exporter Inativo (Sonda Fora do Ar)
  # OBSERVAÇÃO IMPORTANTE: este e o alerta mais importante do arquivo, pois se o Node
  # Exporter cair, TODOS os demais alertas ficam cegos silenciosamente (sem series de dados)
  - alert: NodeExporterInativo
    expr: up{job="JOB_NODE_EXPORTER"} == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "Node Exporter fora do ar"
      description: "O Node Exporter do host {{ $labels.instance }} está inacessível há mais de 2 minutos. Todas as demais métricas deste host estão indisponíveis."
  #
  # Configuração do alerta de: Uso elevado de CPU
  - alert: CPUAlta
    expr: 100 - (avg without (cpu, mode) (rate(node_cpu_seconds_total{job="JOB_NODE_EXPORTER", mode="idle"}[5m]))) * 100 > 80
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Uso elevado de CPU"
      description: "CPU acima de 80% por mais de 5 minutos no host {{ $labels.instance }}."
  #
  # Configuração do alerta de: Uso elevado de Memória RAM
  - alert: MemoriaAlta
    expr: (1 - (node_memory_MemAvailable_bytes{job="JOB_NODE_EXPORTER"} / node_memory_MemTotal_bytes{job="JOB_NODE_EXPORTER"})) * 100 > 80
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Uso elevado de Memória"
      description: "Memória RAM acima de 80% por mais de 5 minutos no host {{ $labels.instance }}."
  #
  # Configuração do alerta de: Uso elevado de Memória Swap
  - alert: SwapAlto
    expr: (node_memory_SwapTotal_bytes{job="JOB_NODE_EXPORTER"} > 0) and ((1 - (node_memory_SwapFree_bytes{job="JOB_NODE_EXPORTER"} / node_memory_SwapTotal_bytes{job="JOB_NODE_EXPORTER"})) * 100 > 50)
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Uso elevado de Swap"
      description: "Área de Swap acima de 50% de utilização no host {{ $labels.instance }}, indício de pressão de memória sustentada."
  #
  # Configuração do alerta de: Hard Disk (Partição/Volume Lógico) quase cheio
  # OBSERVAÇÃO IMPORTANTE: filtro por "mountpoint" ao invés de "device" fixo, pois o nome
  # do Volume Group/Logical Volume do LVM muda conforme o Particionamento de cada servidor
  # (exemplo: ubuntu--vg-lv--root, ubuntu--vg-lv--var, vg_dados-lv_dados, etc)
  - alert: DiscoCheio
    expr: (1 - (node_filesystem_avail_bytes{job="JOB_NODE_EXPORTER", fstype!~"tmpfs|overlay|squashfs|devtmpfs"} / node_filesystem_size_bytes{job="JOB_NODE_EXPORTER", fstype!~"tmpfs|overlay|squashfs|devtmpfs"})) * 100 > 80
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "Disco quase cheio"
      description: "Uso de disco acima de 80% no host {{ $labels.instance }}, ponto de montagem {{ $labels.mountpoint }}."
  #
  # Configuração do alerta de: Previsão de Esgotamento de Disco (Antecipação de Falha)
  - alert: DiscoVaiEsgotar
    expr: predict_linear(node_filesystem_avail_bytes{job="JOB_NODE_EXPORTER", fstype!~"tmpfs|overlay|squashfs|devtmpfs"}[6h], 4 * 3600) < 0
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: "Disco com previsão de esgotamento"
      description: "Com base na tendência das últimas 6 horas, o ponto de montagem {{ $labels.mountpoint }} do host {{ $labels.instance }} deve esgotar o espaço livre nas próximas 4 horas."
  #
  # Configuração do alerta de: Load Average (Processamento) elevado
  - alert: Processamento
    expr: node_load15{job="JOB_NODE_EXPORTER"} > count without (cpu, mode) (node_cpu_seconds_total{job="JOB_NODE_EXPORTER", mode="idle"})
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Load Average elevado"
      description: "Load Average de 15 minutos maior que o número de CPUs disponíveis no host {{ $labels.instance }}, indicando fila de processos aguardando CPU."
  #
  # Configuração do alerta de: Uso elevado de I/O de Disco
  - alert: IOAlto
    expr: rate(node_disk_io_time_seconds_total{job="JOB_NODE_EXPORTER"}[5m]) > 0.8
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Disco com I/O elevado"
      description: "Disco {{ $labels.device }} com tempo de I/O ocupado acima de 80% no host {{ $labels.instance }}."
  #
  # Configuração do alerta de: Relógio do Sistema Dessincronizado (NTP/Chrony)
  # OBSERVAÇÃO IMPORTANTE: essencial em ambientes com Hardening/Auditoria, pois logs,
  # certificados TLS e trilhas de auditoria dependem de um relógio confiável e sincronizado
  - alert: RelogioDessincronizado
    expr: node_timex_sync_status{job="JOB_NODE_EXPORTER"} == 0
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "Relógio do sistema dessincronizado"
      description: "O host {{ $labels.instance }} não está sincronizado com os servidores NTP/Chrony configurados."
  #
  # Configuração do alerta de: Desvio (Offset) de Relógio elevado
  - alert: DesvioRelogioAlto
    expr: abs(node_timex_offset_seconds{job="JOB_NODE_EXPORTER"}) > 0.5
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Desvio de relógio elevado"
      description: "O host {{ $labels.instance }} apresenta desvio de horário acima de 0.5 segundo em relação à referência NTP."
  #
  # Configuração do alerta de: Unidade do Systemd em Estado de Falha (Failed)
  # OBSERVAÇÃO IMPORTANTE: detecta a queda de serviços críticos de Hardening, como
  # sshd, fail2ban, ufw, auditd, chrony, mdmonitor, lvm2-monitor, entre outros
  - alert: ServicoSystemdFalhou
    expr: node_systemd_unit_state{job="JOB_NODE_EXPORTER", state="failed"} == 1
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "Serviço do Systemd em estado de falha"
      description: "A unidade {{ $labels.name }} está em estado 'failed' no host {{ $labels.instance }}."
  #
  # Configuração do alerta de: Reinicialização Recente do Servidor
  - alert: ServidorReiniciado
    expr: (time() - node_boot_time_seconds{job="JOB_NODE_EXPORTER"}) < 600
    labels:
      severity: warning
    annotations:
      summary: "Servidor reiniciado recentemente"
      description: "O host {{ $labels.instance }} foi reiniciado há menos de 10 minutos."
