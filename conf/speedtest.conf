#====== BLOCO DE CONFIGURAÇÃO PADRÃO DO VIRTUAL HOST======

# Configuração do VirtualHost Speedtest
<VirtualHost *:8080>

    # Nome do servidor
    ServerName localhost

    # Diretório de hospedagem do Speedtest
    DocumentRoot /var/www/html/speedtest

    # Configurações do diretório de hospedagem
    <Directory /var/www/html/speedtest>

        # Permitir acesso ao diretório
        Require all granted

        # Permitir acesso por links simbólicos
        Options FollowSymLinks

        # Desabilitar arquivos .htaccess
        AllowOverride None

        # Arquivo padrão da aplicação
        DirectoryIndex index.html index.php

    </Directory>

    # Configuração do Log de Acesso
    ErrorLog ${APACHE_LOG_DIR}/speedtest_error.log

    # Configuração do Log de Erros
    CustomLog ${APACHE_LOG_DIR}/speedtest_access.log combined

</VirtualHost>
